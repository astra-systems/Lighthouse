<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LightHouse Processing</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #02060f;
  color: #e5e7eb;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 40px 20px;
}

h1 { font-size: 42px; }
.small { font-size: 13px; color: #6b7280; }

.grid {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: 24px;
  margin-top: 40px;
}

.card {
  background: #030b1a;
  border: 1px solid #111827;
  border-radius: 14px;
  padding: 20px;
}

.upload {
  border: 1px dashed #374151;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
}

.upload:hover {
  border-color: #22d3ee;
}

.step {
  border: 1px solid #1f2937;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  background: #020817;
}

.step.active {
  border-color: #22d3ee;
  box-shadow: 0 0 18px rgba(34, 211, 238, 0.18);
}

.candidate {
  border: 1px solid #111827;
  background: #020817;
  border-radius: 12px;
  padding: 16px;
  margin-top: 12px;
  opacity: 0;
  animation: fadeIn 0.7s forwards;
}

.gold {
  border-color: rgba(251, 191, 36, 0.45);
}

.btn {
  margin-top: 16px;
  padding: 12px 18px;
  background: #22d3ee;
  color: #02060f;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>
<div class="container">

<h1>Processing Console</h1>
<p class="small">Upload dataset to begin detection pipeline</p>

<div class="grid">

<!-- LEFT SIDE -->
<div class="card">

<h3>Upload Dataset</h3>

<label class="upload">
  Upload CSV Dataset
  <input type="file" id="fileInput" accept=".csv" hidden />
</label>

<div id="fileName" class="small" style="margin-top:10px;"></div>

<button class="btn" onclick="startPipeline()">Run Detection Pipeline</button>

<hr style="margin:20px 0; border-color:#111827">

<h3>Pipeline Progress</h3>

<div id="step1" class="step">Anomaly Detection</div>
<div id="step2" class="step">Cross-Reference</div>
<div id="step3" class="step">Tier 1 Validation</div>
<div id="step4" class="step">Tier 2 Validation</div>
<div id="step5" class="step">Ranking</div>

</div>

<!-- RIGHT SIDE -->
<div class="card">
<h3>Emerging Candidates</h3>
<div id="feed"></div>
</div>

</div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const fileName = document.getElementById('fileName');

fileInput.addEventListener('change', () => {
  fileName.textContent = "Loaded: " + fileInput.files[0].name;
});

function activate(id) {
  document.getElementById(id).classList.add('active');
}

function complete(id) {
  const el = document.getElementById(id);
  el.classList.remove('active');
  el.style.borderColor = '#34d399';
}

function addCandidate(name) {
  const div = document.createElement('div');
  div.className = 'candidate gold';
  div.innerHTML = `<strong>${name}</strong><br><span class='small'>Gold Candidate</span>`;
  document.getElementById('feed').appendChild(div);
}

function startPipeline() {
  if (!fileInput.files.length) {
    alert("Upload a CSV first");
    return;
  }

  activate('step1');

  setTimeout(() => {
    complete('step1');
    activate('step2');
  }, 1500);

  setTimeout(() => {
    complete('step2');
    activate('step3');
    addCandidate('LH-2026-0142');
  }, 3000);

  setTimeout(() => {
    complete('step3');
    activate('step4');
  }, 4500);

  setTimeout(() => {
    complete('step4');
    activate('step5');
  }, 6000);

  setTimeout(() => {
    complete('step5');
  }, 7500);
}
</script>

</body>
</html>
